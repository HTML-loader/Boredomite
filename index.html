<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boredomite</title>
<style>
  :root{
    --bg:#0d1020; --panel:#171b31; --panel2:#202641; --text:#f5f7ff;
    --muted:#aeb6d3; --accent:#8b7cff; --accent2:#4de1c1; --danger:#ff6685;
    --shadow:0 18px 50px rgba(0,0,0,.28); --radius:22px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 10%,rgba(139,124,255,.24),transparent 30%),
      radial-gradient(circle at 85% 20%,rgba(77,225,193,.13),transparent 25%),
      linear-gradient(135deg,#0b0e1b,#12172a 55%,#0b1020);
  }
  button,input{font:inherit}
  button{cursor:pointer;border:0}
  .app{width:min(1120px,94%);margin:auto;padding:30px 0 50px}
  header{
    display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px
  }
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:58px;height:58px;border-radius:18px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#b7aaff);font-size:28px;
    box-shadow:0 10px 30px rgba(139,124,255,.28)
  }
  h1{font-size:clamp(2rem,5vw,3.2rem);margin:0;letter-spacing:-2px}
  .tag{color:var(--muted);margin:4px 0 0}
  .clock{text-align:right}
  #time{font-size:1.45rem;font-weight:800}
  #date{color:var(--muted);font-size:.9rem;margin-top:3px}
  .hero{
    background:rgba(23,27,49,.82);border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);backdrop-filter:blur(12px)
  }
  .add-row{display:flex;gap:10px;flex-wrap:wrap}
  .add-row input{
    flex:1;min-width:210px;background:#0f1325;color:var(--text);border:1px solid #303754;
    border-radius:15px;padding:14px 16px;outline:none
  }
  .add-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,124,255,.13)}
  .primary,.ghost,.danger{
    padding:12px 16px;border-radius:14px;font-weight:800;transition:.18s transform,.18s opacity
  }
  .primary{background:var(--accent);color:white}
  .ghost{background:#292f4b;color:var(--text)}
  .danger{background:rgba(255,102,133,.13);color:#ff9ab0}
  button:hover{transform:translateY(-1px);opacity:.92}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
  .filters{display:flex;gap:7px;flex-wrap:wrap}
  .filter{background:transparent;color:var(--muted);padding:8px 12px;border-radius:10px}
  .filter.active{background:#292f4b;color:var(--text)}
  .stats{color:var(--muted);font-size:.92rem}
  .list{display:grid;gap:12px}
  .item{
    display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
    background:rgba(23,27,49,.9);border:1px solid rgba(255,255,255,.07);
    border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);
    animation:appear .2s ease-out
  }
  @keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .check{
    width:26px;height:26px;border-radius:9px;background:#11162a;border:2px solid #4a5272;
    color:white;display:grid;place-items:center;font-size:15px
  }
  .check.done{background:var(--accent2);border-color:var(--accent2);color:#071c17}
  .title{font-weight:800;font-size:1.04rem;word-break:break-word}
  .done .title{text-decoration:line-through;color:#7e87a6}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .pill{font-size:.78rem;color:#cdd3ea;background:#292f4b;border-radius:999px;padding:5px 9px}
  .pill.overdue{color:#ff9ab0;background:rgba(255,102,133,.12)}
  .actions{display:flex;gap:7px}
  .icon-btn{background:#252b46;color:#dce1f4;border-radius:10px;padding:9px 10px}
  .empty{
    text-align:center;padding:55px 20px;color:var(--muted);border:1px dashed #3a4262;border-radius:20px
  }
  .empty strong{display:block;color:var(--text);font-size:1.2rem;margin-bottom:6px}
  dialog{
    border:1px solid #3a4262;border-radius:22px;background:#171b31;color:var(--text);
    width:min(500px,92%);padding:0;box-shadow:var(--shadow)
  }
  dialog::backdrop{background:rgba(4,6,14,.7);backdrop-filter:blur(4px)}
  .modal{padding:24px}
  .modal h2{margin:0 0 18px}
  .field{display:grid;gap:7px;margin-bottom:14px}
  .field label{font-size:.86rem;color:var(--muted)}
  .field input{
    width:100%;background:#0f1325;color:var(--text);border:1px solid #303754;
    border-radius:13px;padding:12px;outline:none
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#f5f7ff;color:#11162a;padding:11px 16px;border-radius:12px;font-weight:800;
    opacity:0;pointer-events:none;transition:.2s;z-index:5
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:650px){
    header{align-items:flex-start;flex-direction:column}
    .clock{text-align:left}
    .item{grid-template-columns:auto 1fr}
    .actions{grid-column:2}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">✦</div>
      <div><h1>Boredomite</h1><p class="tag">Your personal anti-boredom dashboard.</p></div>
    </div>
    <div class="clock"><div id="time">--:--:--</div><div id="date">Loading date…</div></div>
  </header>

  <section class="hero">
    <div class="add-row">
      <input id="newItem" placeholder="What do you want to do?" maxlength="120" autocomplete="off">
      <button class="primary" id="addBtn">＋ Add idea</button>
    </div>
    <div class="toolbar">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">To do</button>
        <button class="filter" data-filter="done">Done</button>
      </div>
      <div class="stats" id="stats">0 ideas</div>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<dialog id="editDialog">
  <form method="dialog" class="modal" id="editForm">
    <h2>Edit idea ✨</h2>
    <div class="field">
      <label for="editTitle">What is it?</label>
      <input id="editTitle" maxlength="120" required>
    </div>
    <div class="field">
      <label for="editDate">Optional date</label>
      <input id="editDate" type="date">
    </div>
    <div class="modal-actions">
      <button class="ghost" value="cancel">Cancel</button>
      <button class="primary" value="save">Save changes</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = "boredomite-items-v1";
  let items = JSON.parse(localStorage.getItem(KEY) || "[]");
  let filter = "all";
  let editingId = null;

  const $ = id => document.getElementById(id);
  const list = $("list"), input = $("newItem"), stats = $("stats");
  const dialog = $("editDialog"), editTitle = $("editTitle"), editDate = $("editDate");

  function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  function formatDate(value){
    if(!value) return "";
    const d = new Date(value + "T00:00:00");
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  }

  function isOverdue(item){
    if(!item.date || item.done) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    return new Date(item.date+"T00:00:00") < today;
  }

  function render(){
    const shown = items.filter(i =>
      filter === "active" ? !i.done :
      filter === "done" ? i.done : true
    );

    stats.textContent = `${items.length} ${items.length === 1 ? "idea" : "ideas"} • ${items.filter(i=>i.done).length} done`;

    if(!shown.length){
      list.innerHTML = `<div class="empty"><strong>${items.length ? "Nothing here yet." : "Your boredom is waiting. 😎"}</strong>${items.length ? "Try another filter." : "Add your first idea above."}</div>`;
      return;
    }

    list.innerHTML = shown.map(item => `
      <article class="item ${item.done ? "done" : ""}">
        <button class="check ${item.done ? "done" : ""}" data-action="toggle" data-id="${item.id}" aria-label="Mark complete">${item.done ? "✓" : ""}</button>
        <div>
          <div class="title">${escapeHtml(item.title)}</div>
          <div class="meta">
            ${item.date ? `<span class="pill ${isOverdue(item) ? "overdue" : ""}">${isOverdue(item) ? "⚠ " : "📅 "}${formatDate(item.date)}</span>` : `<span class="pill">No date</span>`}
            ${item.done ? `<span class="pill">Completed</span>` : ""}
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn" data-action="edit" data-id="${item.id}" title="Edit">✎</button>
          <button class="icon-btn" data-action="delete" data-id="${item.id}" title="Delete">×</button>
        </div>
      </article>
    `).join("");
  }

  function add(){
    const title = input.value.trim();
    if(!title) return;
    items.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),title,date:"",done:false});
    input.value = "";
    save(); render(); toast("Idea added ✨");
  }

  function edit(id){
    const item = items.find(i=>i.id===id); if(!item) return;
    editingId=id; editTitle.value=item.title; editDate.value=item.date || ""; dialog.showModal(); editTitle.focus();
  }

  $("editForm").addEventListener("submit", e => {
    e.preventDefault();
    const item=items.find(i=>i.id===editingId); if(!item) return;
    item.title=editTitle.value.trim(); item.date=editDate.value;
    if(!item.title) return;
    save(); render(); dialog.close(); toast("Idea updated ✨");
  });

  list.addEventListener("click", e => {
    const btn=e.target.closest("[data-action]"); if(!btn) return;
    const id=btn.dataset.id, action=btn.dataset.action;
    const item=items.find(i=>i.id===id);
    if(action==="toggle"){ item.done=!item.done; save(); render(); toast(item.done ? "Nice! One less thing. 🎉" : "Back on the list."); }
    if(action==="edit") edit(id);
    if(action==="delete"){
      items=items.filter(i=>i.id!==id); save(); render(); toast("Idea removed.");
    }
  });

  $("addBtn").addEventListener("click", add);
  input.addEventListener("keydown", e => { if(e.key==="Enter") add(); });

  document.querySelectorAll(".filter").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active"); filter=btn.dataset.filter; render();
  }));

  function clock(){
    const now=new Date();
    $("time").textContent=now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",second:"2-digit"});
    $("date").textContent=now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  }
  function toast(msg){
    const t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.remove("show"),1800);
  }
  clock(); setInterval(clock,1000); render();
})();
</script>
</body>
</html>
